networks:
  app-networks:
    driver: bridge

services:
  back-end:
    build:
      context: ./Back-end
      dockerfile: Dockerfile
    # Uvicorn inicia o módulo explicitamente; o watch sincroniza o código.
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed_demo && python -m uvicorn app.main:app --host 0.0.0.0 --port 80"]
    environment:
      - DATABASE_URL=sqlite:////data/cria_mais.db
      - DATA_DIR=/data
      - OCR_MOTOR=paddle
      - OCR_LANG=pt
      - LANGUAGETOOL_URL=http://languagetool:8010
      # Outpainting é OPCIONAL: ligue com OUTPAINTING_ATIVO=true no .env
      # e suba com: docker compose --profile outpainting up -d --build
      - OUTPAINTING_ATIVO=${OUTPAINTING_ATIVO:-false}
      - IOPAINT_URL=http://iopaint:8080
    volumes:
      - ./data:/data                           # banco SQLite + briefings + versões das artes
      - ./Agentes/paddle-cache:/root/.paddlex  # modelos do PaddleOCR (baixados na 1ª leitura)
    depends_on:
      - languagetool
    develop:
      watch:
        - action: sync
          path: ./Back-end/app
          target: /code/app
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./Back-end/requirements.txt
        - action: rebuild
          path: ./Back-end/requirements-ocr.txt
    ports:
      - "3000:80"    # só para testar no /docs; o front fala com o back-end pelo Nginx
    networks:
      - app-networks

  # Corretor ortográfico LOCAL (nada sai da sua máquina)
  languagetool:
    image: erikvl87/languagetool
    restart: unless-stopped
    networks:
      - app-networks

  # Só sobe com: docker compose --profile outpainting up -d --build
  iopaint:
    profiles: ["outpainting"]
    build:
      context: ./iopaint
    volumes:
      - ./Agentes/iopaint-models:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/server-config')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    networks:
      - app-networks

  # OPCIONAL (fora do fluxo principal): llava/deepseek-ocr para experimentos futuros.
  # Suba com: docker compose --profile ia up -d
  ollama:
    profiles: ["ia"]
    image: ollama/ollama
    volumes:
      - ./Agentes/ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - app-networks

  front-end:
    build:
      context: ./Front-end
      dockerfile: Dockerfile.dev
    develop:
      watch:
        - action: sync
          path: ./Front-end/app
          target: /app/
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: ./Front-end/app/package.json
    networks:
      - app-networks

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - back-end
      - front-end
    networks:
      - app-networks
